spring.application.name=polizas-api

# Base de datos H2 guardada en disco
spring.datasource.url=jdbc:h2:file:./data/polizas
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear y actualizar tablas durante el desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

core.url=http://localhost:8080/core-mock/evento
app.api-key=123456